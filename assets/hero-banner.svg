<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="100%">
  <defs>
    <!-- Background Gradient: Pure Pitch Black to Dark Slate Mist -->
    <linearGradient id="ghpcBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#030507" />
      <stop offset="50%" stop-color="#06090d" />
      <stop offset="100%" stop-color="#020304" />
    </linearGradient>

    <!-- Cold Mist / Atmospheric Fog (Like GHPC Trench) -->
    <linearGradient id="fogGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#0f1720" stop-opacity="0.8" />
      <stop offset="40%" stop-color="#1e293b" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#030507" stop-opacity="0" />
    </linearGradient>

    <!-- Subtle White Rim Light for Tank Silhouette -->
    <linearGradient id="tankRim" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#475569" />
      <stop offset="35%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#05070a" />
    </linearGradient>

    <!-- Tank Turret Armor Tint -->
    <linearGradient id="turretShade" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2d3748" />
      <stop offset="45%" stop-color="#1a202c" />
      <stop offset="100%" stop-color="#10141d" />
    </linearGradient>

    <!-- Muzzle Flash Lighting Glow (Static, Cinematic) -->
    <radialGradient id="muzzleRim" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f8fafc" stop-opacity="0.2" />
      <stop offset="60%" stop-color="#38bdf8" stop-opacity="0.05" />
      <stop offset="100%" stop-color="#030507" stop-opacity="0" />
    </radialGradient>

    <!-- High-Contrast Stencil Font / Military Stamp -->
    <style>
      .callsign { font-family: 'Impact', 'Arial Black', sans-serif; font-size: 46px; fill: #f8fafc; letter-spacing: 3px; }
      .stencil-sub { font-family: 'Consolas', 'Courier New', monospace; font-weight: 700; font-size: 14px; fill: #94a3b8; letter-spacing: 3.5px; }
      .bio-p { font-family: 'Segoe UI', -apple-system, sans-serif; font-size: 14.5px; fill: #64748b; line-height: 1.6; }
      .tag-lbl { font-family: 'Consolas', 'Courier New', monospace; font-size: 11px; font-weight: 700; letter-spacing: 1.5px; }
      .accent-box { font-family: 'Impact', sans-serif; font-size: 20px; fill: #f8fafc; letter-spacing: 1px; }
    </style>
  </defs>

  <!-- Solid Dark Atmospheric Background -->
  <rect width="1200" height="360" fill="url(#ghpcBg)" />

  <!-- Atmospheric Fog Base Layer -->
  <rect x="0" y="140" width="1200" height="220" fill="url(#fogGrad)" />

  <!-- Minimalist Cold Contrast Border -->
  <rect width="1200" height="360" fill="none" stroke="#1e293b" stroke-width="1.2" />

  <!-- Top Stark White Identity Line (GHPC Style) -->
  <line x1="48" y1="28" x2="160" y2="28" stroke="#f8fafc" stroke-width="2" />
  <text x="175" y="32" class="tag-lbl" fill="#64748b">SYS.SECTOR // TACTICAL SIMULATION</text>

  <!-- Left Content Block -->
  <g transform="translate(48, 86)">
    <!-- Main Big Stencil Name -->
    <text x="0" y="38" class="callsign">ARTHUR BATISTA</text>
    <text x="0" y="68" class="stencil-sub">&gt; GAME DEVELOPER &amp; 3D ARTIST</text>

    <!-- Bio (Direto, sem enrolação técnica) -->
    <text x="0" y="112" class="bio-p">Criador do <tspan fill="#f8fafc" font-weight="700">Sector Quarantine</tspan>, desenvolvendo jogos táticos,</text>
    <text x="0" y="134" class="bio-p">combate militar e modelagem hard-surface 3D no Blender.</text>

    <!-- Clean Tactical Badges (GHPC Monochrome Style) -->
    <g transform="translate(0, 168)">
      <!-- Box 1: Sector Quarantine -->
      <rect x="0" y="0" width="190" height="42" fill="#0b1118" stroke="#334155" stroke-width="1.2" />
      <line x1="0" y1="0" x2="0" y2="42" stroke="#f8fafc" stroke-width="3" />
      <text x="14" y="18" class="tag-lbl" fill="#f8fafc">SECTOR QUARANTINE</text>
      <text x="14" y="32" class="tag-lbl" fill="#64748b" style="font-size:9.5px;">Tactical Zombie RTS</text>

      <!-- Box 2: 3D Modeling -->
      <rect x="206" y="0" width="170" height="42" fill="#0b1118" stroke="#334155" stroke-width="1.2" />
      <line x1="206" y1="0" x2="206" y2="42" stroke="#94a3b8" stroke-width="3" />
      <text x="220" y="18" class="tag-lbl" fill="#f8fafc">HARD-SURFACE 3D</text>
      <text x="220" y="32" class="tag-lbl" fill="#64748b" style="font-size:9.5px;">Blender &amp; Military Rigs</text>

      <!-- Box 3: Roblox Engine -->
      <rect x="392" y="0" width="130" height="42" fill="#0b1118" stroke="#334155" stroke-width="1.2" />
      <line x1="392" y1="0" x2="392" y2="42" stroke="#64748b" stroke-width="3" />
      <text x="406" y="18" class="tag-lbl" fill="#f8fafc">ROBLOX / LUAU</text>
      <text x="406" y="32" class="tag-lbl" fill="#64748b" style="font-size:9.5px;">Game Architecture</text>
    </g>
  </g>

  <!-- ================= RIGHT SIDE: GHPC ART STYLE 2D MILITARY SILHOUETTES ================= -->
  <!-- Pure 2D High-Contrast Tank (M1 Abrams / Bradley Heavy Profile) & Advancing Infantry -->

  <!-- Atmospheric Mound / Berm Silhouette (Rising Trench Ground) -->
  <path d="M 540 360 Q 660 250 820 225 L 1200 225 L 1200 360 Z" fill="#020406" />
  <path d="M 520 360 Q 670 265 840 240 L 1200 240 L 1200 360 Z" fill="#070b10" />

  <!-- Soft Ambient Glow behind the Cannon Barrel -->
  <circle cx="820" cy="140" r="160" fill="url(#muzzleRim)" />

  <!-- ================= 2D MAIN BATTLE TANK (GHPC CONTRAST SILHOUETTE) ================= -->
  <g transform="translate(560, 65)">

    <!-- Long 120mm Gun Barrel with Bore Evacuator (Pointed Forward Left) -->
    <!-- Muzzle Tip / Muzzle Reference Sensor -->
    <rect x="-85" y="70.5" width="8" height="7" fill="#64748b" />
    <rect x="-77" y="72" width="15" height="4" fill="#090d13" />
    <!-- Main Gun Tube -->
    <rect x="-62" y="71" width="175" height="6" fill="#1e293b" />
    <line x1="-62" y1="71" x2="113" y2="71" stroke="#475569" stroke-width="1" />
    <!-- Bore Evacuator / Fume Extractor (Cilindro no meio do cano) -->
    <rect x="-10" y="68" width="48" height="12" rx="1.5" fill="#131b24" stroke="#334155" stroke-width="1.2" />
    <!-- Gun Mantlet Collar (Base do Canhão) -->
    <polygon points="108,62 135,56 135,88 108,82" fill="#0c1117" stroke="#334155" stroke-width="1.2" />

    <!-- Main Angular Turret (Wedge Armor Profile - Like GHPC Logo) -->
    <!-- Turret Cheek (Chapa Frontal Angular Inclinada) -->
    <polygon points="130,56 195,34 330,34 380,48 385,92 130,92" fill="#151d27" stroke="#475569" stroke-width="1.5" />
    <!-- Turret Roof Highlight (Stark Top Edge) -->
    <line x1="195" y1="34" x2="330" y2="34" stroke="#94a3b8" stroke-width="1.8" />
    <!-- Turret Bustle / Rear Stowage Basket -->
    <polygon points="330,34 400,34 405,62 380,62" fill="#0a0f15" stroke="#334155" stroke-width="1" />
    <line x1="330" y1="42" x2="400" y2="42" stroke="#1e293b" stroke-width="1" stroke-dasharray="4 3" />

    <!-- Commander's Cupola & Heavy .50 MG Mounted on Top -->
    <rect x="245" y="24" width="35" height="10" rx="1" fill="#0f1620" stroke="#334155" stroke-width="1" />
    <!-- Machine Gun Mount -->
    <polygon points="215,16 235,16 238,25 212,25" fill="#090e14" />
    <rect x="175" y="17" width="42" height="4" fill="#334155" />
    <rect x="215" y="13" width="12" height="14" fill="#1a2430" /> <!-- Ammo Box -->

    <!-- Gunner Primary Sight Doghouse (Periscópio Blindado) -->
    <rect x="190" y="18" width="22" height="16" rx="1" fill="#0a0f16" stroke="#475569" stroke-width="1" />
    <rect x="194" y="22" width="14" height="8" fill="#38bdf8" fill-opacity="0.6" />

    <!-- Turret Ring Base -->
    <rect x="150" y="92" width="220" height="8" fill="#080c12" />

    <!-- Lower Hull Glacis & Armor Skirts (Chassi do Tanque) -->
    <polygon points="85,100 150,96 420,96 435,125 435,148 65,148 55,125" fill="#0d131a" stroke="#334155" stroke-width="1.2" />
    <!-- Glacis Plate Top Edge Contrast -->
    <line x1="55" y1="125" x2="150" y2="96" stroke="#64748b" stroke-width="1.5" />

    <!-- Tracks & Heavy Rubber-Padded Roadwheels (6x Pares) -->
    <!-- Heavy Side Skirt Plate (Proteção Lateral Rebitada) -->
    <rect x="75" y="120" width="350" height="25" fill="#070a0e" stroke="#1e293b" stroke-width="1" />
    <!-- Skirt Panel Grooves -->
    <line x1="130" y1="120" x2="130" y2="145" stroke="#1e293b" stroke-width="1.5" />
    <line x1="185" y1="120" x2="185" y2="145" stroke="#1e293b" stroke-width="1.5" />
    <line x1="240" y1="120" x2="240" y2="145" stroke="#1e293b" stroke-width="1.5" />
    <line x1="295" y1="120" x2="295" y2="145" stroke="#1e293b" stroke-width="1.5" />
    <line x1="350" y1="120" x2="350" y2="145" stroke="#1e293b" stroke-width="1.5" />

    <!-- Roadwheels Visible Under Skirt Mud Flaps -->
    <g fill="#0b1118" stroke="#1a2330" stroke-width="2">
      <circle cx="110" cy="155" r="14" />
      <circle cx="150" cy="155" r="14" />
      <circle cx="190" cy="155" r="14" />
      <circle cx="230" cy="155" r="14" />
      <circle cx="270" cy="155" r="14" />
      <circle cx="310" cy="155" r="14" />
      <circle cx="350" cy="155" r="14" />
    </g>
    <!-- Bottom Track Return Line Ground Contact -->
    <path d="M 85 168 L 375 168" stroke="#1e293b" stroke-width="4" stroke-dasharray="6 3" />
  </g>

  <!-- ================= ADVANCING INFANTRY SQUAD (GHPC TRENCH STYLE) ================= -->
  <!-- Silhouettes of Soldiers moving alongside the armor into combat -->

  <!-- Soldier 1: Squad Leader (Center-Right, Alert) -->
  <g transform="translate(1015, 135)">
    <!-- Helmet with Night-Vision Mount -->
    <ellipse cx="25" cy="15" rx="9" ry="8" fill="#0d141e" stroke="#64748b" stroke-width="1" />
    <rect x="14" y="15" width="6" height="4" rx="1" fill="#94a3b8" />
    <!-- Head / Balaclava -->
    <circle cx="25" cy="20" r="5" fill="#06090d" />
    <!-- Torso with Plate Carrier & Pouches -->
    <polygon points="16,28 35,28 38,62 14,62" fill="#0a0f16" stroke="#334155" stroke-width="1" />
    <!-- Backpack / Radio Antenna -->
    <rect x="30" y="32" width="10" height="22" rx="2" fill="#070a0f" />
    <line x1="36" y1="32" x2="42" y2="10" stroke="#64748b" stroke-width="1" />
    <!-- Rifle (M4A1 Low Ready) -->
    <polygon points="12,38 4,46 16,50 20,44" fill="#05070a" />
    <line x1="8" y1="44" x2="-18" y2="40" stroke="#94a3b8" stroke-width="2.5" />
    <rect x="-6" y="44" width="8" height="12" fill="#05070a" /> <!-- Magazine -->
    <!-- Legs in Advance / Trench Stance -->
    <polygon points="16,62 26,62 30,98 22,98" fill="#070a0e" />
    <polygon points="26,62 36,62 48,94 40,96" fill="#040608" />
  </g>

  <!-- Soldier 2: Rifleman Advancing (Right) -->
  <g transform="translate(1085, 148)">
    <!-- Helmet -->
    <ellipse cx="22" cy="14" rx="8" ry="7" fill="#0c121a" stroke="#475569" stroke-width="1" />
    <!-- Body -->
    <polygon points="14,24 30,24 32,56 12,56" fill="#080c12" />
    <!-- Weapon Pointing Forward Left -->
    <line x1="12" y1="36" x2="-12" y2="34" stroke="#64748b" stroke-width="2" />
    <!-- Legs -->
    <polygon points="14,56 22,56 24,88 16,88" fill="#05080c" />
    <polygon points="22,56 30,56 38,84 30,86" fill="#030508" />
  </g>

  <!-- Soldier 3: Crouched Scout (Behind Berm, Far Right) -->
  <g transform="translate(1142, 172)">
    <ellipse cx="18" cy="12" rx="7" ry="6" fill="#0a0f16" stroke="#334155" stroke-width="1" />
    <polygon points="10,20 25,20 26,45 8,45" fill="#06090e" />
    <line x1="8" y1="28" x2="-8" y2="26" stroke="#475569" stroke-width="1.8" />
  </g>

  <!-- Dramatic Dark Ground Silhouette Bar -->
  <rect x="0" y="348" width="1200" height="12" fill="#020305" />
</svg>
